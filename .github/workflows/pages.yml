name: Deploy GitHub Pages

on:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths:
      - "site/**"
      - "data/channels.json"
      - "data/fallbacks.json"
      - "data/schedules.json"
      - "parliament_streams/**"
      - "pyproject.toml"
      - "uv.lock"
      - "package.json"
      - "package-lock.json"
      - "tools/build_vendor_assets.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install uv
        run: python -m pip install uv
      - name: Sync Python dependencies
        run: uv sync --locked
      - name: Install npm dependencies and assemble browser assets
        # npm's postinstall also assembles the locked browser assets for scheduled deploys.
        run: npm ci
      - name: Install accessibility test browser
        if: github.event_name != 'schedule'
        run: npx playwright install --with-deps chromium
      - name: Verify catalogue, site data, and accessibility
        if: github.event_name != 'schedule'
        run: make catalogue-validate site-data-check accessibility-check
      - name: Restore the preceding schedule snapshot
        uses: actions/cache/restore@v6
        with:
          path: .schedule-baseline
          key: schedule-snapshot-${{ github.run_id }}
          restore-keys: schedule-snapshot-
      - name: Assemble static site
        run: |
          mkdir -p _site/data
          cp -R site/. _site/
          cp data/channels.json _site/data/channels.json
          cp data/fallbacks.json _site/data/fallbacks.json
          cp data/supranational.json _site/data/supranational.json
      - name: Collect current schedules
        run: >-
          uv run --locked parliament-streams schedules-collect
          --output _site/data/schedules.json
          --previous .schedule-baseline/schedules.json
          --stale-ttl-hours 24
          --minimum-successful-sources 1
      - name: Export IPTV playlists and XMLTV guide
        run: >-
          uv run --locked parliament-streams iptv-export
          --schedules _site/data/schedules.json
          --output-dir _site/data
          --epg-url https://dlq.ca/parliament-streams/data/epg.xml
      - name: Preserve the schedule snapshot
        run: |
          mkdir -p .schedule-baseline
          cp _site/data/schedules.json .schedule-baseline/schedules.json
      - name: Save the schedule snapshot
        uses: actions/cache/save@v6
        with:
          path: .schedule-baseline
          key: schedule-snapshot-${{ github.run_id }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
