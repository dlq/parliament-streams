name: Diagnose Taiwan programme API
on:
  push:
    branches: [codex/taiwan-api-diagnostics]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python tools/diagnose_taiwan_api.py
      - uses: actions/upload-artifact@v6
        with:
          name: taiwan-api-diagnostic
          path: taiwan-api-diagnostic.json
          retention-days: 7
