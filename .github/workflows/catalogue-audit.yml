name: Catalogue Audit

on:
  schedule:
    - cron: "41 6 * * 1-6"
    - cron: "41 6 * * 0"
  workflow_dispatch:
    inputs:
      deep:
        description: Run the weekly Chromium discovery pass
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

concurrency:
  group: catalogue-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Daily catalogue audit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install uv

      - name: Sync Python dependencies
        run: uv sync --locked --extra dev

      - name: Restore preceding stable-health report
        uses: actions/cache/restore@v6
        with:
          path: .audit-baseline
          key: catalogue-audit-${{ github.run_id }}
          restore-keys: catalogue-audit-

      - name: Validate catalogue structure and identity metadata
        id: validate
        run: |
          mkdir -p reports/automated
          uv run --locked parliament-streams validate
          uv run --locked parliament-streams identity-audit \
            --output reports/automated/identity-audit.json

      - name: Audit every primary playback or official URL
        if: ${{ !cancelled() && steps.validate.outcome == 'success' }}
        run: >-
          uv run --locked parliament-streams health-check
          --timeout 12
          --retries 1
          --workers 8
          --output reports/automated/catalogue-health.json

      - name: Audit stable streams for regressions
        id: stable-health
        if: ${{ !cancelled() && steps.validate.outcome == 'success' }}
        run: |
          mapfile -t stable_ids < <(jq -r '.channels[] | select(.availability == "always_on" and .stability_risk != "high") | .id' data/channels.json)
          args=()
          for channel_id in "${stable_ids[@]}"; do
            args+=(--id "$channel_id")
          done
          uv run --locked parliament-streams health-check \
            "${args[@]}" \
            --timeout 12 \
            --retries 1 \
            --workers 8 \
            --output reports/automated/stable-health.json

      - name: Compare stable streams with the preceding run
        id: health-diff
        if: ${{ !cancelled() && steps.stable-health.outcome == 'success' }}
        continue-on-error: true
        run: |
          if [[ -f .audit-baseline/stable-health.json ]]; then
            uv run --locked parliament-streams health-diff \
              .audit-baseline/stable-health.json \
              reports/automated/stable-health.json \
              --output reports/automated/stable-health-diff.json \
              --fail-on-regression
          else
            echo '{"regressions":[],"recoveries":[],"changes":[]}' > reports/automated/stable-health-diff.json
          fi

      - name: Update stable-stream regression issues
        if: ${{ !cancelled() && hashFiles('reports/automated/stable-health-diff.json') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create stream-regression \
            --color d73a4a \
            --description "Automated regression in an always-on stream" \
            --force
          while IFS=$'\t' read -r channel_id before after source_kind stability_risk; do
            title="Stable stream regression: $channel_id"
            number=$(gh issue list \
              --state all \
              --label stream-regression \
              --limit 100 \
              --json number,title | \
              jq -r --arg title "$title" '.[] | select(.title == $title) | .number')
            {
              echo "The daily catalogue audit detected a regression in the always-on stream \`$channel_id\`."
              echo
              echo "- Previous status: \`$before\`"
              echo "- Current status: \`$after\`"
              echo "- Source kind: \`$source_kind\`"
              echo "- Stability risk: \`$stability_risk\`"
              echo "- Evidence: $RUN_URL"
              echo
              echo "Confirm the endpoint from another network and inspect the retained health report before changing catalogue metadata."
            } > regression-issue.md
            if [[ -n "$number" ]]; then
              gh issue edit "$number" --body-file regression-issue.md
              state=$(gh issue view "$number" --json state --jq '.state')
              if [[ "$state" == "CLOSED" ]]; then
                gh issue reopen "$number"
              fi
            else
              gh issue create \
                --title "$title" \
                --label stream-regression \
                --body-file regression-issue.md
            fi
          done < <(jq -r '.regressions[] | [.id, .before, .after, .source_kind, .stability_risk] | @tsv' reports/automated/stable-health-diff.json)
          while IFS= read -r channel_id; do
            title="Stable stream regression: $channel_id"
            number=$(gh issue list \
              --state open \
              --label stream-regression \
              --limit 100 \
              --json number,title | \
              jq -r --arg title "$title" '.[] | select(.title == $title) | .number')
            if [[ -n "$number" ]]; then
              gh issue close "$number" \
                --reason completed \
                --comment "The daily audit recorded a recovery for \`$channel_id\`. Evidence: $RUN_URL"
            fi
          done < <(jq -r '.recoveries[].id' reports/automated/stable-health-diff.json)

      - name: Audit schedule endpoints
        if: ${{ !cancelled() && steps.validate.outcome == 'success' }}
        run: >-
          uv run --locked parliament-streams epg-audit
          --timeout 12
          --retries 0
          --workers 8
          --output reports/automated/epg-audit.json

      - name: Collect parsed schedules
        id: schedules
        if: ${{ !cancelled() && steps.validate.outcome == 'success' }}
        run: >-
          uv run --locked parliament-streams schedules-collect
          --timeout 15
          --retries 1
          --previous .audit-baseline/schedules.json
          --stale-ttl-hours 24
          --minimum-successful-sources 1
          --output reports/automated/schedules.json

      - name: Audit schedule quality and linear guide eligibility
        if: ${{ !cancelled() && steps.schedules.outcome == 'success' }}
        run: >-
          uv run --locked parliament-streams schedules-audit
          --schedules reports/automated/schedules.json
          --output reports/automated/schedule-quality.json

      - name: Update repeated schedule-source failure issues
        if: ${{ !cancelled() && hashFiles('reports/automated/schedules.json') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          uv run --locked python tools/build_schedule_issue_plan.py \
            --schedules reports/automated/schedules.json \
            --output reports/automated/schedule-issue-plan.json
          gh label create schedule-regression \
            --color d97706 \
            --description "Repeated failure in a schedule source" \
            --force
          while IFS=$'\t' read -r action source_id status failures error; do
            title="Schedule source regression: $source_id"
            number=$(gh issue list \
              --state all \
              --label schedule-regression \
              --limit 100 \
              --json number,title | \
              jq -r --arg title "$title" '.[] | select(.title == $title) | .number')
            if [[ "$action" == "open" ]]; then
              {
                echo "The schedule collector has failed for \`$source_id\` in $failures consecutive runs."
                echo
                echo "- Latest error: \`$error\`"
                echo "- Evidence: $RUN_URL"
                echo
                echo "Check whether the endpoint, request requirements, or parser contract changed before editing catalogue metadata."
              } > schedule-regression-issue.md
              if [[ -n "$number" ]]; then
                gh issue edit "$number" --body-file schedule-regression-issue.md
                state=$(gh issue view "$number" --json state --jq '.state')
                if [[ "$state" == "CLOSED" ]]; then
                  gh issue reopen "$number"
                fi
              else
                gh issue create \
                  --title "$title" \
                  --label schedule-regression \
                  --body-file schedule-regression-issue.md
              fi
            elif [[ "$action" == "close" && -n "$number" ]]; then
              state=$(gh issue view "$number" --json state --jq '.state')
              if [[ "$state" == "OPEN" ]]; then
                gh issue close "$number" \
                  --reason completed \
                  --comment "The schedule collector successfully parsed current data for this source. Evidence: $RUN_URL"
              fi
            fi
          done < <(jq -r '.actions[] | [.action, .source_id, .status, .consecutive_failures, (.error // "none")] | @tsv' reports/automated/schedule-issue-plan.json)

      - name: Audit official, rights, identity, and embed links
        if: ${{ !cancelled() && steps.validate.outcome == 'success' }}
        run: >-
          uv run --locked parliament-streams links-audit
          --timeout 12
          --retries 0
          --workers 8
          --output reports/automated/links-audit.json

      - name: Write audit summary
        if: always()
        run: |
          write_counts() {
            local path="$1" label="$2"
            if [[ -f "$path" ]]; then
              jq -r --arg label "$label" '$label + ": " + (.counts | to_entries | map("\(.key)=\(.value)") | join(", "))' "$path"
            else
              echo "$label: not produced (the audit step failed or was skipped)."
            fi
          }
          {
            echo "## Catalogue audit"
            echo
            write_counts reports/automated/catalogue-health.json "Primary sources"
            write_counts reports/automated/epg-audit.json "Schedule endpoints"
            write_counts reports/automated/links-audit.json "Supporting links"
            write_counts reports/automated/schedules.json "Parsed schedules"
            write_counts reports/automated/schedule-quality.json "Schedule quality"
            if [[ -f reports/automated/stable-health-diff.json ]]; then
              jq -r '"Stable-stream regressions: \(.regressions | length); recoveries: \(.recoveries | length)"' reports/automated/stable-health-diff.json
            else
              echo "Stable-stream regressions: not produced (the audit step failed or was skipped)."
            fi
            if [[ -f reports/automated/catalogue-health.json ]]; then
              jq -r '"High-risk source results: " + ([.results[] | select(.stability_risk == "high") | .status] | group_by(.) | map("\(.[0])=\(length)") | join(", "))' reports/automated/catalogue-health.json
            else
              echo "High-risk source results: not produced (the audit step failed or was skipped)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve current audit baselines
        if: >-
          always() &&
          (hashFiles('reports/automated/stable-health.json') != '' ||
          hashFiles('reports/automated/schedules.json') != '')
        run: |
          mkdir -p .audit-baseline
          if [[ -f reports/automated/stable-health.json ]]; then
            cp reports/automated/stable-health.json .audit-baseline/stable-health.json
          fi
          if [[ -f reports/automated/schedules.json ]]; then
            cp reports/automated/schedules.json .audit-baseline/schedules.json
          fi

      - name: Save stable-health baseline
        if: always() && hashFiles('.audit-baseline/stable-health.json') != ''
        uses: actions/cache/save@v6
        with:
          path: .audit-baseline
          key: catalogue-audit-${{ github.run_id }}

      - name: Upload daily audit reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: catalogue-audit-${{ github.run_id }}
          path: reports/automated
          if-no-files-found: warn
          retention-days: 30

      - name: Fail on new stable-stream regressions
        if: ${{ !cancelled() && steps.health-diff.outcome == 'failure' }}
        run: exit 1

  deep-audit:
    name: Weekly browser and manifest audit
    needs: audit
    if: >-
      always() &&
      (github.event.schedule == '41 6 * * 0' ||
      (github.event_name == 'workflow_dispatch' && inputs.deep))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: |
          python -m pip install uv
          uv sync --locked --extra dev
          npm ci
          npx playwright install --with-deps chromium

      - name: Generate complete official-page seed
        run: |
          mkdir -p reports/automated
          uv run --locked parliament-streams seed \
            --output reports/automated/catalogue-seed.json

      - name: Inspect rendered pages and check manifest formats
        run: >-
          node tools/deep_validate_browser.mjs
          --input reports/automated/catalogue-seed.json
          --output reports/automated/deep-browser-validation.json

      - name: Sanitize and check weekly browser evidence
        id: deep-evidence-safety
        if: ${{ !cancelled() && hashFiles('reports/automated/*.json') != '' }}
        run: |
          for report in reports/automated/*.json; do
            if [[ -f "$report" ]]; then
              uv run --locked python tools/sanitize_research_evidence.py --sanitize "$report"
            fi
          done
          uv run --locked python tools/sanitize_research_evidence.py --check reports/automated

      - name: Upload weekly deep-audit reports
        if: ${{ !cancelled() && steps.deep-evidence-safety.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: catalogue-deep-audit-${{ github.run_id }}
          path: reports/automated
          if-no-files-found: warn
          retention-days: 90
