name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Verify catalogue and scrapers
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check whitespace
        run: git diff --check

      - name: Install uv
        run: python -m pip install uv

      - name: Check Python formatting
        run: make format-check

      - name: Lint Python
        run: make lint

      - name: Verify catalogue, site data, compilation, tests, and coverage
        run: make json-check site-data-check compile coverage
