name: Suggest or review a translation
description: Help improve wording in any supported language. No coding needed.
title: "[Translation]: "
body:
  - type: markdown
    attributes:
      value: Thanks for helping! One phrase or one page is a useful contribution. You can write this report in the language you are reviewing.
  - type: input
    id: language
    attributes:
      label: Language or regional variant
      placeholder: French (Canada), Czech, Traditional Chinese…
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Page or feature
      description: A page link, button name or short description helps locate the wording.
      placeholder: Catalogue filters, schedule page, VLC instructions…
    validations:
      required: true
  - type: textarea
    id: wording
    attributes:
      label: Current wording and suggested wording
      description: Copy the current text if possible and explain how you would say it. A description is fine if you cannot copy the text.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context or screenshots (optional)
      description: Explain any terminology, regional usage, pronunciation or layout issue. Official terminology links are welcome.
