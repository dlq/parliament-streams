name: Share an idea or help improve the project
description: Accessibility, usability, documentation, research, code, or another contribution.
title: "[Contribution]: "
body:
  - type: markdown
    attributes:
      value: Contributions of any size are welcome. Tell us what you noticed or what you would like to help with; technical details are optional.
  - type: textarea
    id: contribution
    attributes:
      label: What would you like to share or improve?
      description: Describe your idea, question, finding or proposed contribution, and who it could help.
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Relevant page, source or document (optional)
      description: A link or name helps us find the right place.
  - type: textarea
    id: context
    attributes:
      label: Context or examples (optional)
      description: Screenshots, examples, official references or reproduction steps are useful when available.
