name: Report a broken stream, player or page
description: Tell us what you tried and what happened. Technical diagnostics are optional.
title: "[Endpoint]: "
labels: ["endpoint", "validation"]
body:
  - type: markdown
    attributes:
      value: Thanks for checking a source. Its name and what happened are enough to start; extra details help when you have them.
  - type: input
    id: channel
    attributes:
      label: Channel or source
      description: Name the channel/source and include the catalogue id if known.
      placeholder: CPAC Canada, or a catalogue link
    validations:
      required: true
  - type: input
    id: endpoint
    attributes:
      label: Endpoint or official page URL
      description: Paste the page or stream link if you have it. A catalogue link is useful too.
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Describe what you saw, such as a blank player, an error message, the wrong programme or a broken link.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: A date/time, country, browser/device, screenshot or official source link helps. Technical checks are welcome when available.
  - type: textarea
    id: caveats
    attributes:
      label: Caveats
      description: Note off-air timing, geofencing, sign-in prompts, temporary outages, or event-only availability.
