name: Suggest or correct an official source
description: Share an official parliamentary viewing page or a correction. A raw stream URL is optional.
title: "[Source]: "
labels: ["source"]
body:
  - type: markdown
    attributes:
      value: Thanks for sharing local knowledge! The legislature name and an official viewing page are enough to start. Chamber, committee, audio and archive services are all useful leads.
  - type: input
    id: source_name
    attributes:
      label: Legislature, broadcaster, or source name
      placeholder: New Zealand Parliament TV
    validations:
      required: true
  - type: input
    id: official_page
    attributes:
      label: Official page URL
      description: Link to the legislature, broadcaster, official player, or official YouTube page.
    validations:
      required: true
  - type: input
    id: stream_url
    attributes:
      label: Stream, embed, or player URL
      description: Include HLS/DASH/embed/player URL if known. Leave blank if this is a link-out source.
  - type: dropdown
    id: source_type
    attributes:
      label: Source type
      options:
        - Unknown
        - Direct HLS
        - Direct DASH
        - Official web player
        - Official YouTube
        - Official page/link-out
  - type: textarea
    id: validation
    attributes:
      label: Validation notes
      description: Describe what you tried, if anything. Date, country, browser/device and technical checks are useful when available.
  - type: textarea
    id: terms
    attributes:
      label: Terms, attribution, or source-quality notes
      description: Link to terms or explain known restrictions, attribution requirements, geofencing, or off-air behavior.
