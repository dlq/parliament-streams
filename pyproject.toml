[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "parliament-streams"
version = "0.1.0"
description = "Documentation, data, and source scrapers for public parliamentary stream research."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.23,<5"]
license = "BSD-3-Clause"
license-files = ["LICENSE"]

[project.scripts]
parliament-streams = "parliament_streams.cli:main"

[project.optional-dependencies]
dev = [
    "coverage[toml]>=7.15.4,<8",
    "mypy>=1.15,<3",
    "ruff==0.16.3",
    "types-jsonschema>=4.23,<5",
]

[tool.coverage.run]
branch = true
source = ["parliament_streams"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true

[tool.setuptools.packages.find]
include = ["parliament_streams*"]
